# Run on each PROD host. Pushes metrics + logs to the monitor host. No ports opened.
# Setup: cp .env.example .env ; edit .env ; ./setup.sh
services:
  node-exporter:
    image: prom/node-exporter:v1.8.1
    pid: host
    volumes: ['/proc:/host/proc:ro', '/sys:/host/sys:ro', '/:/rootfs:ro']
    command: [--path.procfs=/host/proc, --path.sysfs=/host/sys, --path.rootfs=/rootfs]
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    devices: ['/dev/kmsg:/dev/kmsg']
    volumes: ['/:/rootfs:ro', '/var/run:/var/run:rw', '/sys:/sys:ro', '/var/lib/docker:/var/lib/docker:ro']
    command: ['--docker_only=true', '--housekeeping_interval=10s', '--disable_metrics=disk,diskIO']
    restart: unless-stopped

  # Exporters below start only when setup.sh enables their profile (see .env).
  redis-exporter:
    profiles: [redis]
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    networks: [default, app]
    restart: unless-stopped

  mysqld-exporter:
    profiles: [mysql]
    image: prom/mysqld-exporter:v0.15.1
    command: [--config.my-cnf=/cfg/mysqld.cnf]
    volumes: ['./mysqld.cnf:/cfg/mysqld.cnf:ro']
    networks: [default, app]
    restart: unless-stopped

  nginx-exporter:
    profiles: [nginx]
    image: nginx/nginx-prometheus-exporter:1.3.0
    command: ['--nginx.scrape-uri=http://${NGINX_HOST:-nginx}/stub_status']
    networks: [default, app]
    restart: unless-stopped

  prometheus-agent:
    image: prom/prometheus:v2.53.0
    user: root  # fresh volume is root-owned; image default user cannot write /data
    command:
      - --enable-feature=agent
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.agent.path=/data
    volumes:
      - ./prometheus-agent.yml:/etc/prometheus/prometheus.yml:ro
      - ./ingest_password:/etc/prometheus/ingest_password:ro
      - agent_data:/data
    networks: [default, app]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    command: [-config.file=/etc/promtail/config.yml, -config.expand-env=true]
    environment:
      HOST_NAME: ${HOST_NAME}
      INGEST_URL: ${INGEST_URL}
      INGEST_USER: ${INGEST_USER}
      INGEST_PASSWORD: ${INGEST_PASSWORD}
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${LARAVEL_ROOT:-/var/www}:/laravel:ro
      - ./promtail.yml:/etc/promtail/config.yml:ro
      - promtail_positions:/positions
    restart: unless-stopped

networks:
  app:
    external: true
    name: ${APP_NETWORK:-bridge}

volumes:
  agent_data:
  promtail_positions:
