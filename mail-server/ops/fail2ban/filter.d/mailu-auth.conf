# Dovecot login failures as logged by the Mailu `front` container.
#
# Observed line (submission, port 587):
#   submission-login: Info: Disconnected: Connection closed (auth failed, 2 attempts
#   in 4 secs): user=<info@a.test>, method=LOGIN, rip=203.0.113.9, rport=47914,
#   lip=192.168.203.5, lport=587, TLS: Connection closed
#
# Only "auth failed" counts. Dovecot also logs "no auth attempts in N secs" for
# clients that connect and hang up; those are probes, not guesses, and banning
# on them would catch ordinary monitoring checks.

[Definition]

failregex = ^(?:.*\s)?(?:imap|pop3|submission|submissions|managesieve)-login: Info: .*\(auth failed, \d+ attempts in \d+ secs\):.*\brip=<HOST>(?:,|\s|$)

ignoreregex = ^(?:.*\s)?\S+-login: Info: .*\(no auth attempts in \d+ secs\)

# The leading (?:.*\s)? tolerates the syslog timestamp being present (file
# backend) or already stripped by fail2ban's datepattern (systemd backend).
datepattern = ^%%b %%d %%H:%%M:%%S
              {^LN-BEG}
