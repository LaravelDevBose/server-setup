# Failed Mailu web logins, read from the `front` container's nginx access log.
#
# Mailu's admin container logs nothing useful at LOG_LEVEL=WARNING, so the HTTP
# status is the signal: a rejected /sso/login re-renders the form with 200,
# a successful one answers 302 with a redirect to /admin or /webmail.
#
# Observed line:
#   203.0.113.9 - - [30/Aug/2026:18:50:35 +0000] "POST /sso/login HTTP/2.0" 200 7379 "-" "curl/8.7.1"
#
# <HOST> is only the real client if REAL_IP_HEADER and REAL_IP_FROM are set in
# mailu.env. Without them every hit looks like the host nginx bridge address and
# the jail will ban your own reverse proxy. See the ignoreip in jail.d/mailu.local.

[Definition]

failregex = ^<HOST> \- \S+ (?:\[[^\]]*\] )?"POST /sso/login HTTP/[^"]+" 200\b

ignoreregex =

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
