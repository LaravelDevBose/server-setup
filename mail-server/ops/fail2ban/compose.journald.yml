# Routes the front container's logs to journald so fail2ban can read them with
# its systemd backend, which handles timestamps and rotation natively.
#
#   docker compose -f docker-compose.yml -f ops/fail2ban/compose.journald.yml up -d
#
# The tag is what jail.d/mailu.local matches on; it survives container
# recreation, whereas the generated container name does not.
services:
  front:
    logging:
      driver: journald
      options:
        tag: mailu-front
