worker_processes 1;
events { worker_connections 256; }
http {
    upstream docker {
        server unix:/var/run/docker.sock;
    }
    server {
        listen 2375;

        # Rewrite any client API version to 1.47 before forwarding to daemon.
        # Docker 29+ requires >= 1.40; Traefik's Go SDK sends 1.24 by default.
        location ~ ^/v[0-9]+\.[0-9]+(/.*)$ {
            rewrite ^/v[0-9]+\.[0-9]+(/.*)$ /v1.47$1 break;
            proxy_pass         http://docker;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_read_timeout 3600s;
            proxy_buffering    off;
        }

        location / {
            proxy_pass         http://docker;
            proxy_http_version 1.1;
            proxy_buffering    off;
        }
    }
}
