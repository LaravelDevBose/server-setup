services:
  redis:
    image: redis:7-alpine
    container_name: common-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      bcs-net:
        aliases:
          - common-redis
    # Hidden internally on port 6379.
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  bcs-net:
    external: true

volumes:
  redis_data:
    driver: local