global:
  scrape_interval: 15s

# This host. Prod hosts push via remote_write (see agent/), labelled host=<name>.
scrape_configs:
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels: {host: monitor}

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels: {host: monitor}

  - job_name: prometheus
    static_configs:
      - targets: [ 'localhost:9090' ]
        labels: { host: monitor }