server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: ${INGEST_URL}/loki/api/v1/push
    basic_auth:
      username: ${INGEST_USER}
      password: ${INGEST_PASSWORD}

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      - target_label: host
        replacement: ${HOST_NAME}
    pipeline_stages:
      # CloudBiz360's nginx and Laravel app log both emit a top-level "level"
      # key (INFO/WARNING/ERROR) by design - App\Utilities\CloudBizJsonFormatter
      # on the app side, docker/nginx/*.conf's json_combined on the nginx side -
      # so one shared stage labels both. Non-JSON lines pass untouched.
      # Other shared keys (status, uri, channel, request_id, message, ...)
      # stay in the line: query with `| json`.
      - json:
          expressions:
            level: level
      - labels:
          level:

  # Laravel JSON file logs (storage/logs/*.log), one JSON object per line
  - job_name: laravel
    static_configs:
      - targets: [localhost]
        labels: {job: laravel, host: "${HOST_NAME}", __path__: /laravel/**/storage/logs/*.log}
    pipeline_stages:
      - json:
          expressions:
            level: level
      - labels:
          level:

  - job_name: varlog
    static_configs:
      - targets: [localhost]
        labels: {job: varlog, host: "${HOST_NAME}", __path__: /var/log/**/*.log}
